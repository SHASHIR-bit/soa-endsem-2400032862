spring.application.name=RESTAURENT-SERVICE

# Port 0 asks Spring Boot to choose an available port dynamically.
server.port=0

# Eureka Server address (local Eclipse execution).
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Give every running instance a unique Eureka ID.
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Heartbeat/lease settings (defaults are 30 and 90 seconds).
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90
